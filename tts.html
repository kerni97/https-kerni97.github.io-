<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>OBS TTS Fix</title>
    <script src="https://unpkg.com/tmi.js@1.8.5/browser/tmi.min.js"></script>
    <style>
        body { background-color: #222; color: white; font-family: sans-serif; text-align: center; }
        #status { font-size: 20px; color: #00ff00; margin: 20px; padding: 10px; border: 2px solid #00ff00; }
        button { width: 90%; padding: 30px; font-size: 25px; background: #e67e22; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; }
        #log { margin-top: 20px; font-family: monospace; text-align: left; padding: 10px; background: #000; height: 150px; overflow: hidden; }
    </style>
</head>
<body>

    <div id="status">Verbindung wird geprüft...</div>
    
    <!-- DIESER BUTTON IST DER SCHLÜSSEL -->
    <button id="playBtn">KLICK MICH IN OBS (INTERAGIEREN)!</button>

    <div id="log">Chat Log:<br></div>

    <script>
        const log = (m) => { document.getElementById('log').innerHTML += m + "<br>"; };
        const status = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');

        let audioReady = false;

        // Funktion zum Sprechen
        function speak(text) {
            if (!audioReady) {
                log("Audio nicht bereit! Klicke den Button!");
                return;
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            window.speechSynthesis.speak(utterance);
            log("Spreche: " + text);
        }

        // Twitch Verbindung startet SOFORT beim Laden
        const client = new tmi.Client({
            channels: [ 'kerniitv_97' ]
        });

        client.on('message', (channel, tags, message, self) => {
            log(tags['display-name'] + ": " + message);
            if (message.toLowerCase().startsWith('!say')) {
                const text = message.replace('!say', '').trim();
                speak(tags['display-name'] + " sagt " + text);
            }
        });

        client.connect().then(() => {
            status.innerText = "✅ VERBUNDEN MIT TWITCH";
        }).catch(err => {
            status.innerText = "❌ FEHLER BEIM VERBINDEN";
            log(err);
        });

        // Beim Klick Audio freischalten
        playBtn.addEventListener('click', () => {
            audioReady = true;
            playBtn.style.backgroundColor = "#27ae60";
            playBtn.innerText = "AUDIO IST AKTIV!";
            speak("System bereit. Ich kann jetzt sprechen.");
        });
    </script>
</body>
</html>

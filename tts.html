<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>KerniiTV TTS Test</title>
    <script src="https://unpkg.com/tmi.js@1.8.5/browser/tmi.min.js"></script>
    <style>
        /* Damit wir auf der weißen Seite was sehen */
        body { 
            background-color: #222; 
            color: white; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        #status { 
            padding: 20px; 
            border: 2px solid #555; 
            border-radius: 10px;
            background: #333;
        }
        .online { color: #00ff00; }
        .message { margin-top: 20px; color: #ffaa00; font-weight: bold; }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- WICHTIG: Der Button aktiviert die Sprachausgabe im Browser -->
    <button id="startBtn">TTS Aktivieren & Starten</button>
    
    <div id="status">Warte auf Klick...</div>
    <div id="last-msg" class="message"></div>

    <script>
        const TWITCH_CHANNEL = 'kerniitv_97';
        const statusDiv = document.getElementById('status');
        const lastMsgDiv = document.getElementById('last-msg');
        const startBtn = document.getElementById('startBtn');

        let ttsEnabled = false;

        // Funktion zum Vorlesen
        function speak(text) {
            if (!ttsEnabled) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            window.speechSynthesis.speak(utterance);
        }

        // Klick-Event um Browser-Sperre aufzuheben
        startBtn.addEventListener('click', () => {
            ttsEnabled = true;
            statusDiv.innerHTML = "TTS ist <span class='online'>BEREIT</span>. Warte auf Chat...";
            startBtn.style.display = 'none'; // Button verschwindet nach Klick
            
            // Test-Stimme
            speak("System aktiviert. Ich höre jetzt auf deinen Twitch Chat.");
        });

        // Twitch Verbindung
        const client = new tmi.Client({
            connection: { secure: true, reconnect: true },
            channels: [ TWITCH_CHANNEL ]
        });

        client.connect().catch(console.error);

        client.on('message', (channel, tags, message, self) => {
            if (self) return;

            if (message.toLowerCase().startsWith('!say ')) {
                const textToSpeak = message.slice(5).trim();
                const user = tags['display-name'];
                
                lastMsgDiv.innerText = user + " sagt: " + textToSpeak;
                speak(user + " sagt " + textToSpeak);
            }
        });

        client.on('connected', () => {
            console.log("Verbunden!");
        });
    </script>
</body>
</html>

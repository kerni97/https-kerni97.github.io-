<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Twitch Debug</title>
    <script src="https://bundle.run/tmi.js@1.8.5"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; padding: 20px; }
        #status { font-size: 20px; padding: 10px; border: 2px solid #555; text-align: center; }
        #error-log { color: #ff4444; margin-top: 10px; font-weight: bold; }
        #chat-log { background: #000; height: 100px; padding: 10px; margin-top: 10px; border: 1px solid #333; overflow: hidden; }
        button { width: 100%; padding: 20px; background: #e67e22; color: white; border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="status">Warte auf Start...</div>
    <div id="error-log"></div>
    <br>
    <button onclick="connectTwitch()">1. VERBINDUNG STARTEN</button>
    <br><br>
    <button onclick="testAudio()">2. AUDIO TESTEN</button>

    <div id="chat-log">Letzte Nachricht: <br>---</div>

    <script>
        const statusDiv = document.getElementById('status');
        const errorDiv = document.getElementById('error-log');
        const chatDiv = document.getElementById('chat-log');
        let audioActive = false;

        function speak(text) {
            if (!audioActive) return;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'de-DE';
            window.speechSynthesis.speak(ut);
        }

        function testAudio() {
            audioActive = true;
            speak("Audio Test erfolgreich.");
            statusDiv.innerText = "Audio ist jetzt AKTIV";
        }

        function connectTwitch() {
            audioActive = true;
            statusDiv.innerText = "Verbinde zu Twitch...";
            errorDiv.innerText = "";

            const client = new tmi.Client({
                connection: { secure: true, reconnect: true },
                channels: [ 'kerniitv_97' ]
            });

            client.on('message', (channel, tags, message, self) => {
                chatDiv.innerHTML = "Letzte Nachricht: <br>" + tags['display-name'] + ": " + message;
                if (message.toLowerCase().startsWith('!say')) {
                    speak(tags['display-name'] + " sagt " + message.replace('!say', '').trim());
                }
            });

            client.connect()
                .then(() => {
                    statusDiv.innerText = "✅ VERBUNDEN!";
                    statusDiv.style.borderColor = "#00ff00";
                    speak("System bereit.");
                })
                .catch(err => {
                    statusDiv.innerText = "❌ VERBINDUNGSFEHLER";
                    errorDiv.innerText = "Fehler: " + err;
                    console.error(err);
                });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>KerniiTV TTS Overlay</title>
    <!-- Wir laden die Twitch-Chat-Library -->
    <script src="https://unpkg.com/tmi.js@1.8.5/browser/tmi.min.js"></script>
    <style>
        body { background: transparent; color: white; font-family: sans-serif; overflow: hidden; }
        .status { font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="status" class="status">TTS bereit - Warte auf Chat...</div>

    <script>
        // --- KONFIGURATION ---
        const TWITCH_CHANNEL = 'kerniitv_97'; // Dein Kanalname
        const COMMAND = '!say';              // Befehl für TTS (z.B. !say Hallo)
        const TTS_SPEED = 1.0;               // Geschwindigkeit (0.1 bis 2.0)
        const TTS_PITCH = 1.0;               // Tonhöhe (0.1 bis 2.0)
        
        // Liste verbotener Wörter (einfach erweitern)
        const BLACKLIST = ['schimpfwort1', 'schimpfwort2', 'trollwort'];

        // --- TWITCH CONNECTION ---
        const client = new tmi.Client({
            connection: { secure: true, reconnect: true },
            channels: [ TWITCH_CHANNEL ]
        });

        client.connect();

        client.on('message', (channel, tags, message, self) => {
            if (self) return; // Ignoriere Nachrichten vom Bot selbst

            // Prüfen, ob die Nachricht mit unserem Befehl startet
            if (message.toLowerCase().startsWith(COMMAND)) {
                let textToSpeak = message.slice(COMMAND.length).trim();
                
                // Sicherheit: Schimpfwörter filtern
                const containsBlacklisted = BLACKLIST.some(word => textToSpeak.toLowerCase().includes(word));
                
                if (containsBlacklisted) {
                    console.log("TTS blockiert: Schimpfwort gefunden.");
                    return;
                }

                // Nachricht vorlesen
                speak(textToSpeak, tags['display-name']);
            }
        });

        // --- TTS FUNKTION ---
        function speak(text, username) {
            // Optional: Sage vorher, wer spricht (z.B. "Florian sagt: ...")
            const fullText = `${username} sagt: ${text}`;
            
            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'de-DE'; // Deutsche Stimme
            utterance.rate = TTS_SPEED;
            utterance.pitch = TTS_PITCH;
            
            // Status-Anzeige aktualisieren
            document.getElementById('status').innerText = "Spricht gerade: " + text;
            
            window.speechSynthesis.speak(utterance);
        }

        client.on('connected', () => {
            document.getElementById('status').innerText = "Verbunden mit " + TWITCH_CHANNEL;
        });
    </script>
</body>
</html>

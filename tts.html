<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Twitch Verbindungstest</title>
    <script src="https://unpkg.com/tmi.js@1.8.5/browser/tmi.min.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; padding: 20px; }
        #log-box { background: #000; border: 1px solid #444; height: 300px; overflow-y: scroll; padding: 10px; font-family: monospace; color: #0f0; }
        .system { color: #aaa; }
        .chat-msg { color: #fff; border-bottom: 1px solid #222; padding: 2px; }
        button { padding: 10px; background: #e67e22; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Twitch Chat Monitor</h2>
    <button onclick="startEverything()">1. STARTEN & AUDIO AKTIVIEREN</button>
    
    <p>Status: <span id="conn-status">Getrennt</span></p>

    <div id="log-box">
        <div class="system">Warte auf Start...</div>
    </div>

    <script>
        const logBox = document.getElementById('log-box');
        const statusSpan = document.getElementById('conn-status');
        let ttsActive = false;

        function addLog(text, type = 'system') {
            const div = document.createElement('div');
            div.className = type;
            div.innerText = "[" + new Date().toLocaleTimeString() + "] " + text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function speak(text) {
            if (!ttsActive) return;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'de-DE';
            window.speechSynthesis.speak(ut);
        }

        const client = new tmi.Client({
            connection: { secure: true, reconnect: true },
            channels: [ 'kerniitv_97' ]
        });

        client.on('message', (channel, tags, message, self) => {
            addLog(tags['display-name'] + ": " + message, 'chat-msg');
            
            if (message.toLowerCase().startsWith('!say')) {
                const talk = message.replace('!say', '').trim();
                speak(tags['display-name'] + " sagt " + talk);
            }
        });

        client.on('connected', () => {
            statusSpan.innerText = "VERBUNDEN mit kerniitv_97";
            statusSpan.style.color = "#0f0";
            addLog("ERFOLG: Verbindung zum Chat hergestellt!");
        });

        function startEverything() {
            ttsActive = true;
            addLog("Audio aktiviert. Test-Stimme wird abgespielt...");
            speak("Verbindung wird aufgebaut.");
            client.connect().catch(err => addLog("FEHLER: " + err, 'chat-msg'));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>KerniiTV TTS Diagnose</title>
    <script src="https://unpkg.com/tmi.js@1.8.5/browser/tmi.min.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        #status { font-weight: bold; padding: 10px; margin-bottom: 20px; border: 1px solid #444; }
        #log { color: #555; font-size: 0.8rem; margin-top: 20px; border-top: 1px solid #333; }
        .highlight { color: #00ff00; font-size: 1.5rem; margin: 20px; }
        button { padding: 15px; background: #e67e22; color: white; border: none; cursor: pointer; margin: 5px; }
        #last-chat { font-size: 1.2rem; color: #ffcc00; background: #222; padding: 10px; }
    </style>
</head>
<body>

    <div id="status">Schritt 1: Klicke einen der Buttons</div>
    
    <button onclick="startTTS()">1. TTS STARTEN (Twitch)</button>
    <button onclick="testVoice()">2. NUR AUDIO TESTEN</button>

    <div class="highlight" id="display">Warte auf Aktion...</div>
    
    <div id="last-chat">Letzter Chat-Befehl: (noch nichts)</div>

    <div id="log">Event Log:<br></div>

    <script>
        const log = (msg) => { 
            document.getElementById('log').innerHTML += msg + "<br>";
            console.log(msg);
        };

        let ttsEnabled = false;
        const display = document.getElementById('display');
        const chatDisplay = document.getElementById('last-chat');

        // Stimmen vorladen (wichtig für Chrome/OBS)
        window.speechSynthesis.getVoices();

        function speak(text) {
            log("Versuche zu sprechen: " + text);
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            
            utterance.onstart = () => log("Browser hat Audio gestartet...");
            utterance.onerror = (e) => log("TTS FEHLER: " + e.error);
            
            window.speechSynthesis.speak(utterance);
        }

        function startTTS() {
            ttsEnabled = true;
            document.getElementById('status').innerText = "✅ Twitch-Verbindung aktiv!";
            display.innerText = "Höre auf !say im Twitch-Chat...";
            speak("System aktiviert. Twitch Verbindung steht.");
        }

        function testVoice() {
            display.innerText = "Audio-Test...";
            speak("Das ist ein Test der Audioausgabe ohne Twitch.");
        }

        // Twitch Client
        const client = new tmi.Client({
            connection: { secure: true, reconnect: true },
            channels: [ 'kerniitv_97' ]
        });

        client.on('message', (channel, tags, message, self) => {
            if (self) return;
            log("Nachricht erhalten: " + message);

            if (message.toLowerCase().startsWith('!say')) {
                const user = tags['display-name'];
                const content = message.slice(4).trim();
                chatDisplay.innerText = "Befehl von " + user + ": " + content;
                
                if (ttsEnabled) {
                    speak(user + " sagt " + content);
                } else {
                    log("Befehl ignoriert: TTS nicht gestartet (Button drücken!)");
                }
            }
        });

        client.connect().then(() => log("Verbunden mit Twitch Chat von kerniitv_97"));

    </script>
</body>
</html>
